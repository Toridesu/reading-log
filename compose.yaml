# ローカル開発用のPostgreSQLを起動する設定。docker compose up で読み込まれる。
name: reading-log

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: readinglog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.sh first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run scripts/setup-local.sh first}
    # 自分のPCからだけDBへ接続できるよう、公開先を127.0.0.1に限定する。
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    # データをコンテナの外へ保存し、コンテナを作り直しても引き継ぐ。
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/init-app.sh:ro
    # DBが接続を受け付ける状態か確認する。--wait はこの成功を待つ。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d readinglog"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # 認証を担当するローカル専用サーバー。開発モードのためAWSへは持ち込まない。
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/setup-local.sh first}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8081}
      KC_HEALTH_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Run scripts/setup-local.sh first}
      LOCAL_USER_PASSWORD: ${LOCAL_USER_PASSWORD:?Run scripts/setup-local.sh first}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/reading-log-realm.json:/opt/keycloak/data/import/reading-log-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  keycloak_data:
  postgres_data:
