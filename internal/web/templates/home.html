<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>読書ノート</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="notebook">
      <header>
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 8c-4-3-9-3-12-2v20c4-1 8-1 12 2 4-3 8-3 12-2V6c-3-1-8-1-12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M16 8v20" stroke="currentColor" stroke-width="1.5" />
        </svg>
        <h1>読書ノート</h1>
        {{if .}}
        <div class="account">
          <span>{{.Name}}</span>
          <form method="post" action="/auth/logout">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <button type="submit">ログアウト</button>
          </form>
        </div>
        {{end}}
      </header>
      {{if .}}
      <div class="page-lines" aria-hidden="true"></div>
      {{else}}
      <div class="welcome"><a class="login-button" href="/auth/login">ログイン</a></div>
      {{end}}
    </main>
  </body>
</html>
